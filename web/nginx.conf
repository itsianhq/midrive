server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /config.js {
    add_header Cache-Control "no-cache";
  }

  location / {
        try_files $uri $uri/ /index.html;
  }
}
